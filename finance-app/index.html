<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Finance Easy</title>
    <meta name="description" content="Gestão financeira pessoal — controla receitas, despesas, cartões e metas." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Finance Easy" />
    <meta property="og:description" content="Gestão financeira pessoal — controla receitas, despesas, cartões e metas." />
    <meta property="og:type" content="website" />

    <!-- Apply the saved theme before first paint, so the loading spinner never
         flashes the default light-theme color before switching to the real one. -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("finance-theme") || "dark";
          var html = document.documentElement;
          html.setAttribute("data-theme", theme);
          if (theme === "dark" || theme === "green-dark") html.classList.add("dark");
        } catch (e) {}
      })();
    </script>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" id="theme-color-meta" content="#9B5FFA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finance Easy" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" id="favicon-link" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
