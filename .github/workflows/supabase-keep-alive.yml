name: Supabase Keep Alive

on:
  schedule:
    # Every 3 days at 08:00 UTC — well under Supabase's 7-day pause window
    - cron: "0 8 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl --silent --show-error --output /dev/null --write-out "HTTP %{http_code}\n" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/categories?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}"
